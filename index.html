<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
    }

    .banner {
      display: none;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <img
    id="desktopBanner"
    class="banner"
    src="./desktop-banner.png?v=5"
    alt="Desktop banner"
  >

  <img
    id="mobileBanner"
    class="banner"
    src="./mobile-banner.png?v=5"
    alt="Mobile banner"
  >

  <script>
    function showCorrectBanner() {
      const mobile =
        window.innerWidth <= 768 ||
        screen.width <= 768 ||
        (window.visualViewport &&
          window.visualViewport.width <= 768) ||
        window.matchMedia("(max-width: 768px)").matches ||
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

      document.getElementById("desktopBanner").style.display =
        mobile ? "none" : "block";

      document.getElementById("mobileBanner").style.display =
        mobile ? "block" : "none";
    }

    showCorrectBanner();

    window.addEventListener("load", showCorrectBanner);
    window.addEventListener("resize", showCorrectBanner);
    window.addEventListener("orientationchange", showCorrectBanner);

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        showCorrectBanner
      );
    }
  </script>

</body>
</html>
