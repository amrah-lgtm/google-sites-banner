<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
    }

    picture,
    img {
      display: block;
      width: 100%;
    }

    img {
      height: auto;
    }
  </style>
</head>

<body>

  <picture>
    <source
      media="(max-width: 768px)"
      srcset="./mobile-banner.png"
    >

    <img
      src="./desktop-banner.png"
      alt="Website banner"
    >
  </picture>

</body>
</html>
