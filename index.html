<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    .desktop-banner,
    .mobile-banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .mobile-banner {
      display: none;
    }

    @media screen and (max-width: 900px) {
      .desktop-banner {
        display: none !important;
      }

      .mobile-banner {
        display: block !important;
      }
    }
  </style>
</head>

<body>

  <img
    class="desktop-banner"
    src="./desktop-banner.png"
    alt="Desktop banner"
  >

  <img
    class="mobile-banner"
    src="./mobile-banner.png"
    alt="Mobile banner"
  >

</body>
</html>
