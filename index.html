<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    #mobileBanner {
      display: none;
    }
  </style>
</head>

<body>

  <img
    id="desktopBanner"
    class="banner"
    src="./desktop-banner.png?v=2"
    alt="Desktop banner"
  >

  <img
    id="mobileBanner"
    class="banner"
    src="./mobile-banner.png?v=2"
    alt="Mobile banner"
  >

  <script>
    const isMobile =
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
      navigator.maxTouchPoints > 1;

    if (isMobile) {
      document.getElementById("desktopBanner").style.display = "none";
      document.getElementById("mobileBanner").style.display = "block";
    }
  </script>

</body>
</html>
