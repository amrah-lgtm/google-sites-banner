<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
}

.desktop{
    width:100%;
    display:block;
}

.mobile{
    width:100%;
    display:none;
}

@media (max-width:768px){
    .desktop{
        display:none;
    }
    .mobile{
        display:block;
    }
}
</style>

</head>

<body>

<img class="desktop" src="/desktop-banner.png" alt="Desktop Banner">
<img class="mobile" src="/mobile-banner.png" alt="Mobile Banner">

</body>
</html>
